name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    uses: homebridge/.github/.github/workflows/eslint.yml@latest

  # Runs `npm run build --if-present` and `npm run test`, on Node 22, 24 and 26.
  # The `--if-present` is what keeps this usable for the JavaScript plugins,
  # which have no build script - they run the tests only.
  build-and-test:
    uses: homebridge/.github/.github/workflows/nodejs-build-and-test.yml@latest
    with:
      # Fails the build when the changelog's top section does not list every
      # unreleased commit, in order. Without it the mismatch only shows up at
      # release time. `npm run changelog:sync` fixes one up locally.
      check_changelog: true
